<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TV Shows Hub</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
	<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #000000;
			color: #f0f0f0;
			font-family: 'Poppins', sans-serif;
			min-height: 100vh;
			padding: 10px;
			overflow-x: hidden;
			position: relative;
		}

		#particles-js {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

		header {
			position: relative;
			z-index: 2;
			text-align: center;
			padding: 2rem 1rem 1rem;
		}

		.logo {
			font-size: 2.5rem;
			font-weight: 600;
			color: #6f33ea;
			margin-bottom: 0.5rem;
			text-shadow: 0 0 20px rgba(111, 51, 234, 0.5);
		}

		.tagline {
			color: #b0b0b0;
			font-size: 1rem;
			font-weight: 400;
		}

		.search-section {
			position: relative;
			z-index: 2;
			padding: 2rem 1rem 1rem;
			display: flex;
			justify-content: center;
		}

		.search-container {
			position: relative;
			width: 100%;
			max-width: 600px;
		}

		.search-input {
			width: 100%;
			padding: 15px 25px;
			font-size: 1.1rem;
			color: #fff;
			background: rgba(111, 51, 234, 0.1);
			border: 2px solid #6f33ea;
			border-radius: 25px;
			outline: none;
			transition: all 0.3s ease;
			backdrop-filter: blur(6px);
		}

		.search-input:focus {
			border-color: #8855f7;
			box-shadow: 0 0 15px rgba(111, 51, 234, 0.3);
			background: rgba(111, 51, 234, 0.15);
		}

		.search-input::placeholder {
			color: rgba(255, 255, 255, 0.5);
		}

		.search-icon {
			position: absolute;
			right: 20px;
			top: 50%;
			transform: translateY(-50%);
			color: #6f33ea;
			font-size: 1.2rem;
		}

		.category-section {
			position: relative;
			z-index: 2;
			padding: 0 1rem 2rem;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.75rem;
		}

		.category-tabs {
			display: flex;
			gap: 0.5rem;
			background: rgba(111, 51, 234, 0.08);
			backdrop-filter: blur(6px);
			border-radius: 25px;
			padding: 0.5rem;
			border: 2px solid rgba(111, 51, 234, 0.2);
			flex-wrap: wrap;
			justify-content: center;
		}

		.category-tabs-second {
			background: rgba(111, 51, 234, 0.04);
		}

		.category-tab {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 20px;
			background: transparent;
			color: #b0b0b0;
			font-size: 0.9rem;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.3s ease;
			white-space: nowrap;
		}

		.category-tab:hover {
			color: #f0f0f0;
			background: rgba(111, 51, 234, 0.15);
			transform: translateY(-2px);
		}

		.category-tab.active {
			background: #6f33ea;
			color: white;
			font-weight: 600;
			box-shadow: 0 4px 15px rgba(111, 51, 234, 0.3);
		}

		main {
			position: relative;
			z-index: 2;
			padding: 0 1rem 4rem;
		}

		.section-title {
			font-size: 1.8rem;
			font-weight: 600;
			margin-bottom: 2rem;
			text-align: center;
			color: #f0f0f0;
			text-shadow: 0 2px 10px rgba(111, 51, 234, 0.3);
		}

		.shows-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 30px;
			max-width: 1400px;
			margin: 0 auto;
		}

		.show-card {
			position: relative;
			border-radius: 20px;
			overflow: hidden;
			cursor: pointer;
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			background: rgba(17, 17, 17, 0.8);
			border: 3px solid #6f33ea;
			backdrop-filter: blur(5px);
			aspect-ratio: 2/3;
		}

		.show-card::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(45deg, transparent, rgba(111, 51, 234, 0.1), transparent);
			transform: translateX(-100%);
			transition: 0.5s;
			z-index: 1;
		}

		.show-card:hover::before {
			transform: translateX(100%);
		}

		.show-card:hover {
			transform: translateY(-8px) scale(1.02);
			box-shadow: 0 15px 30px rgba(111, 51, 234, 0.3);
			border-color: #8855f7;
		}

		.show-poster {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.3s ease;
		}

		.show-card:hover .show-poster {
			transform: scale(1.05);
		}

		.show-overlay {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
			padding: 2rem 1.5rem 1.5rem;
			transform: translateY(100%);
			transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
			z-index: 2;
			max-height: 60%;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
		}

		.show-card:hover .show-overlay {
			transform: translateY(0);
		}

		.show-title {
			font-size: 1.1rem;
			font-weight: 600;
			margin-bottom: 0.5rem;
			line-height: 1.2;
			color: #f0f0f0;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.show-year {
			color: #b0b0b0;
			font-size: 0.9rem;
			font-weight: 400;
			margin-bottom: 0.5rem;
		}

		.show-info {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.show-genres {
			display: flex;
			flex-wrap: wrap;
			gap: 0.25rem;
			max-height: 3rem;
			overflow: hidden;
		}

		.genre-badge {
			color: #f0f0f0;
			font-size: 0.75rem;
			font-weight: 500;
			background: rgba(111, 51, 234, 0.2);
			backdrop-filter: blur(10px);
			padding: 0.2rem 0.5rem;
			border-radius: 12px;
			white-space: nowrap;
			border: 1px solid rgba(111, 51, 234, 0.3);
		}

		.show-rating {
			position: absolute;
			top: 1rem;
			right: 1rem;
			background: rgba(0, 0, 0, 0.8);
			backdrop-filter: blur(10px);
			padding: 0.5rem 0.75rem;
			border-radius: 15px;
			font-size: 0.85rem;
			font-weight: 600;
			color: #6f33ea;
			z-index: 2;
			border: 1px solid rgba(111, 51, 234, 0.3);
		}

		.loading {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 200px;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid rgba(111, 51, 234, 0.1);
			border-top: 3px solid #6f33ea;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		.no-results {
			text-align: center;
			padding: 4rem 2rem;
			color: #b0b0b0;
		}

		.no-results h3 {
			font-size: 1.5rem;
			margin-bottom: 1rem;
			color: #f0f0f0;
		}

		/* TV Show Player Overlay */
		.show-player-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.95);
			backdrop-filter: blur(10px);
			z-index: 1001;
			align-items: center;
			justify-content: center;
		}

		.show-player-overlay.active {
			display: flex;
		}

		.show-player-container {
			position: relative;
			width: 100%;
			height: 100%;
			background: #000;
			border: 3px solid #6f33ea;
			border-radius: 20px;
			overflow: hidden;
			margin: 20px;
		}

		.show-player-iframe {
			width: 100%;
			height: 100%;
			border: none;
		}

		.close-player-btn {
			position: absolute;
			top: 20px;
			right: 20px;
			width: 50px;
			height: 50px;
			background: rgba(111, 51, 234, 0.1);
			backdrop-filter: blur(10px);
			border: 2px solid #6f33ea;
			border-radius: 50%;
			color: #6f33ea;
			font-size: 1.5rem;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.3s ease;
			z-index: 1002;
		}

		.close-player-btn:hover {
			background: rgba(111, 51, 234, 0.2);
			border-color: #8855f7;
			transform: scale(1.1);
			color: #8855f7;
		}

	

		/* Responsive design */
		@media (max-width: 768px) {
			.logo {
				font-size: 2rem;
			}

			.shows-grid {
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				gap: 20px;
			}

			.category-tabs {
				gap: 0.3rem;
			}

			.category-tab {
				font-size: 0.8rem;
				padding: 0.6rem 1.2rem;
			}
		}

		@media (max-width: 480px) {
			.shows-grid {
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: 15px;
			}
		}
	</style>
</head>

<body>
	<div id="particles-js"></div>

	<header>
		<h1 class="logo">TV Shows Hub</h1>
		<p class="tagline">Discover your next favorite series</p>
	</header>

	<div class="search-section">
		<div class="search-container">
			<input type="text" class="search-input" placeholder="Search for TV shows..." id="searchInput">
			<div class="search-icon"></div>
		</div>
	</div>

	<div class="category-section">
		<div class="category-tabs">
			<button class="category-tab active" data-genre="10759">Action & Adventure</button>
			<button class="category-tab" data-genre="35">Comedy</button>
			<button class="category-tab" data-genre="18">Drama</button>
			<button class="category-tab" data-genre="9648">Mystery</button>
			<button class="category-tab" data-genre="80">Crime</button>
			<button class="category-tab" data-genre="10765">Sci-Fi & Fantasy</button>
		</div>
		<div class="category-tabs category-tabs-second">
			<button class="category-tab" data-genre="10751">Family</button>
			<button class="category-tab" data-genre="10764">Reality</button>
			<button class="category-tab" data-genre="99">Documentary</button>
			<button class="category-tab" data-genre="10766">Soap</button>
			<button class="category-tab" data-genre="10768">War & Politics</button>
		</div>
	</div>

	<main>
		<h2 class="section-title" id="sectionTitle">Popular TV Shows</h2>
		<div class="shows-grid" id="showsGrid">
			<div class="loading">
				<div class="spinner"></div>
			</div>
		</div>
	</main>

	<div class="show-player-overlay" id="showPlayerOverlay">
		<div class="show-player-container">
			<button class="close-player-btn" id="closePlayerBtn">×</button>
			<iframe class="show-player-iframe" id="showPlayerIframe" src="" allowfullscreen></iframe>
		</div>
	</div>

	<script>
		// Initialize particles.js
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#6f33ea'
                },
                shape: {
                    type: 'circle'
                },
                opacity: {
                    value: 0.5,
                    random: false,
                    anim: {
                        enable: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#6f33ea',
                    opacity: 0.4,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'bottom',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                    attract: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: false,
                        mode: 'repulse'
                    },
                    onclick: {
                        enable: false,
                        mode: 'push'
                    },
                    resize: true
                }
            },
            retina_detect: true
        });

		const API_KEY = "79c1de8a90112f2951a563bb7ce87969";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_BASE_URL = "https://image.tmdb.org/t/p/w500";
        
        const searchInput = document.getElementById("searchInput");
        const showsGrid = document.getElementById("showsGrid");
        const sectionTitle = document.getElementById("sectionTitle");
        const showPlayerOverlay = document.getElementById("showPlayerOverlay");
        const showPlayerIframe = document.getElementById("showPlayerIframe");
        const closePlayerBtn = document.getElementById("closePlayerBtn");

        let searchTimeout;
        let currentGenre = "10759"; // Default to Action & Adventure

        const genreTitles = {
            "10759": "Action & Adventure Shows",
            "35": "Comedy Shows",
            "18": "Drama Shows", 
            "9648": "Mystery Shows",
            "80": "Crime Shows",
            "10765": "Sci-Fi & Fantasy Shows",
            "10751": "Family Shows",
            "10764": "Reality Shows",
            "99": "Documentary Shows",
            "10766": "Soap Shows",
            "10768": "War & Politics Shows"
        };

        // TV Genre mapping for display
        const genreMap = {
            10759: "Action & Adventure",
            16: "Animation",
            35: "Comedy",
            80: "Crime",
            99: "Documentary",
            18: "Drama",
            10751: "Family",
            10762: "Kids",
            9648: "Mystery",
            10763: "News",
            10764: "Reality",
            10765: "Sci-Fi & Fantasy",
            10766: "Soap",
            10767: "Talk",
            10768: "War & Politics",
            37: "Western"
        };

        async function fetchShowsByGenre(genreId) {
            try {
                showsGrid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                const response = await fetch(`${BASE_URL}/discover/tv?api_key=${API_KEY}&with_genres=${genreId}&sort_by=popularity.desc`);
                const data = await response.json();
                
                displayShows(data.results);
                sectionTitle.textContent = genreTitles[genreId];
                currentGenre = genreId;
            } catch (error) {
                console.error(`Error fetching genre ${genreId} shows:`, error);
                showError();
            }
        }

        async function fetchPopularShows() {
            await fetchShowsByGenre("10759"); // Default to Action & Adventure
        }

        async function searchShows(query) {
            if (!query.trim()) {
                fetchShowsByGenre(currentGenre);
                return;
            }

            try {
                showsGrid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                const response = await fetch(`${BASE_URL}/search/tv?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.results.length === 0) {
                    showNoResults(query);
                } else {
                    displayShows(data.results);
                    sectionTitle.textContent = `Search Results for "${query}"`;
                }
            } catch (error) {
                console.error("Error searching shows:", error);
                showError();
            }
        }

        function displayShows(shows) {
            showsGrid.innerHTML = "";
            
            shows.forEach(show => {
                if (!show.poster_path) return; // Skip shows without posters
                
                const showCard = document.createElement("div");
                showCard.className = "show-card";
                showCard.onclick = () => {
                    playShow(show);
                };

                const releaseYear = show.first_air_date ? new Date(show.first_air_date).getFullYear() : 'N/A';
                const rating = show.vote_average ? show.vote_average.toFixed(1) : 'N/A';
                
                // Get genres for this show as individual badges
                const showGenres = show.genre_ids ? 
                    show.genre_ids.map(id => genreMap[id]).filter(Boolean).map(genre => 
                        `<span class="genre-badge">${genre}</span>`
                    ).join('') : '';

                showCard.innerHTML = `
                    <img src="${IMG_BASE_URL}${show.poster_path}" alt="${show.name}" class="show-poster">
                    <div class="show-rating">⭐ ${rating}</div>
                    <div class="play-now-btn" title="Play Show"></div>
                    <div class="show-overlay">
                        <div class="show-title">${show.name}</div>
                        <div class="show-info">
                            <div class="show-year">${releaseYear}</div>
                            ${showGenres ? `<div class="show-genres">${showGenres}</div>` : ''}
                        </div>
                    </div>
                `;

                showsGrid.appendChild(showCard);
            });
        }

        function playShow(show) {
            // Directly play the show starting from Season 1, Episode 1
            showPlayerIframe.src = `https://vidfast.pro/tv/${show.id}/1/1?autoPlay=true`;
            showPlayerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeShowPlayer() {
            showPlayerOverlay.classList.remove('active');
            showPlayerIframe.src = ''; // Stop the video
            document.body.style.overflow = 'auto';
        }

        function showNoResults(query) {
            showsGrid.innerHTML = `
                <div class="no-results">
                    <h3>No TV shows found</h3>
                    <p>We couldn't find any shows matching "${query}". Try a different search term.</p>
                </div>
            `;
            sectionTitle.textContent = "Search Results";
        }

        function showError() {
            showsGrid.innerHTML = `
                <div class="no-results">
                    <h3>Something went wrong</h3>
                    <p>We're having trouble loading TV shows right now. Please try again later.</p>
                </div>
            `;
        }

        // Category tab functionality
        document.addEventListener('DOMContentLoaded', function() {
            const categoryTabs = document.querySelectorAll(".category-tab");
            
            categoryTabs.forEach(tab => {
                tab.addEventListener("click", () => {
                    // Clear search input when switching categories
                    searchInput.value = "";
                    
                    // Update active tab
                    categoryTabs.forEach(t => t.classList.remove("active"));
                    tab.classList.add("active");
                    
                    // Fetch shows for selected genre
                    const genreId = tab.dataset.genre;
                    fetchShowsByGenre(genreId);
                });
            });
        });

        // Search functionality with debouncing
        searchInput.addEventListener("input", (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            searchTimeout = setTimeout(() => {
                searchShows(query);
            }, 500);
        });

        // Enter key search
        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                clearTimeout(searchTimeout);
                searchShows(e.target.value.trim());
            }
        });

        // Player event listeners
        closePlayerBtn.addEventListener('click', closeShowPlayer);
        
        // Close player when clicking outside the iframe
        showPlayerOverlay.addEventListener('click', (e) => {
            if (e.target === showPlayerOverlay) {
                closeShowPlayer();
            }
        });

        // Close with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (showPlayerOverlay.classList.contains('active')) {
                    closeShowPlayer();
                }
            }
        });

        // Initialize with popular shows
        fetchPopularShows();
	</script>
</body>
