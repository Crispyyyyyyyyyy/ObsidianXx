<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Movies Hub</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
	<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #000000;
			color: #f0f0f0;
			font-family: 'Poppins', sans-serif;
			min-height: 100vh;
			padding: 10px;
			overflow-x: hidden;
			position: relative;
		}

		#particles-js {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

		header {
			position: relative;
			z-index: 2;
			text-align: center;
			padding: 2rem 1rem 1rem;
		}

		.logo {
			font-size: 2.5rem;
			font-weight: 600;
			color: #6f33ea;
			margin-bottom: 0.5rem;
			text-shadow: 0 0 20px rgba(111, 51, 234, 0.5);
		}

		.tagline {
			color: #b0b0b0;
			font-size: 1rem;
			font-weight: 400;
		}

		.search-section {
			position: relative;
			z-index: 2;
			padding: 2rem 1rem 1rem;
			display: flex;
			justify-content: center;
		}

		.search-container {
			position: relative;
			width: 100%;
			max-width: 600px;
		}

		.search-input {
			width: 100%;
			padding: 15px 25px;
			font-size: 1.1rem;
			color: #fff;
			background: rgba(111, 51, 234, 0.1);
			border: 2px solid #6f33ea;
			border-radius: 25px;
			outline: none;
			transition: all 0.3s ease;
			backdrop-filter: blur(6px);
		}

		.search-input:focus {
			border-color: #8855f7;
			box-shadow: 0 0 15px rgba(111, 51, 234, 0.3);
			background: rgba(111, 51, 234, 0.15);
		}

		.search-input::placeholder {
			color: rgba(255, 255, 255, 0.5);
		}

		.search-icon {
			position: absolute;
			right: 20px;
			top: 50%;
			transform: translateY(-50%);
			color: #6f33ea;
			font-size: 1.2rem;
		}

		.category-section {
			position: relative;
			z-index: 2;
			padding: 0 1rem 2rem;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.75rem;
		}

		.category-tabs {
			display: flex;
			gap: 0.5rem;
			background: rgba(111, 51, 234, 0.08);
			backdrop-filter: blur(6px);
			border-radius: 25px;
			padding: 0.5rem;
			border: 2px solid rgba(111, 51, 234, 0.2);
			flex-wrap: wrap;
			justify-content: center;
		}

		.category-tabs-second {
			background: rgba(111, 51, 234, 0.04);
		}

		.category-tab {
			padding: 0.75rem 1.5rem;
			border: none;
			border-radius: 20px;
			background: transparent;
			color: #b0b0b0;
			font-size: 0.9rem;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.3s ease;
			white-space: nowrap;
		}

		.category-tab:hover {
			color: #f0f0f0;
			background: rgba(111, 51, 234, 0.15);
			transform: translateY(-2px);
		}

		.category-tab.active {
			background: #6f33ea;
			color: white;
			font-weight: 600;
			box-shadow: 0 4px 15px rgba(111, 51, 234, 0.3);
		}

		main {
			position: relative;
			z-index: 2;
			padding: 0 1rem 4rem;
		}

		.section-title {
			font-size: 1.8rem;
			font-weight: 600;
			margin-bottom: 2rem;
			text-align: center;
			color: #f0f0f0;
			text-shadow: 0 2px 10px rgba(111, 51, 234, 0.3);
		}

		.movies-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 30px;
			max-width: 1400px;
			margin: 0 auto;
		}

		.movie-card {
			position: relative;
			border-radius: 20px;
			overflow: hidden;
			cursor: pointer;
			transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			background: rgba(17, 17, 17, 0.8);
			border: 3px solid #6f33ea;
			backdrop-filter: blur(5px);
			aspect-ratio: 2/3;
		}

		.movie-card::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(45deg, transparent, rgba(111, 51, 234, 0.1), transparent);
			transform: translateX(-100%);
			transition: 0.5s;
			z-index: 1;
		}

		.movie-card:hover::before {
			transform: translateX(100%);
		}

		.movie-card:hover {
			transform: translateY(-8px) scale(1.02);
			box-shadow: 0 15px 30px rgba(111, 51, 234, 0.3);
			border-color: #8855f7;
		}

		.movie-poster {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.3s ease;
		}

		.movie-card:hover .movie-poster {
			transform: scale(1.05);
		}

		.movie-overlay {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
			padding: 2rem 1.5rem 1.5rem;
			transform: translateY(100%);
			transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
			z-index: 2;
			max-height: 60%;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
		}

		.movie-card:hover .movie-overlay {
			transform: translateY(0);
		}

		.movie-title {
			font-size: 1.1rem;
			font-weight: 600;
			margin-bottom: 0.5rem;
			line-height: 1.2;
			color: #f0f0f0;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.movie-year {
			color: #b0b0b0;
			font-size: 0.9rem;
			font-weight: 400;
			margin-bottom: 0.5rem;
		}

		.movie-info {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.movie-genres {
			display: flex;
			flex-wrap: wrap;
			gap: 0.25rem;
			max-height: 3rem;
			overflow: hidden;
		}

		.genre-badge {
			color: #f0f0f0;
			font-size: 0.75rem;
			font-weight: 500;
			background: rgba(111, 51, 234, 0.2);
			backdrop-filter: blur(10px);
			padding: 0.2rem 0.5rem;
			border-radius: 12px;
			white-space: nowrap;
			border: 1px solid rgba(111, 51, 234, 0.3);
		}

		.movie-rating {
			position: absolute;
			top: 1rem;
			right: 1rem;
			background: rgba(0, 0, 0, 0.8);
			backdrop-filter: blur(10px);
			padding: 0.5rem 0.75rem;
			border-radius: 15px;
			font-size: 0.85rem;
			font-weight: 600;
			color: #6f33ea;
			z-index: 2;
			border: 1px solid rgba(111, 51, 234, 0.3);
		}

		.loading {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 200px;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid rgba(111, 51, 234, 0.1);
			border-top: 3px solid #6f33ea;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		.no-results {
			text-align: center;
			padding: 4rem 2rem;
			color: #b0b0b0;
		}

		.no-results h3 {
			font-size: 1.5rem;
			margin-bottom: 1rem;
			color: #f0f0f0;
		}

		/* Movie Player Overlay */
		.movie-player-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.95);
			backdrop-filter: blur(10px);
			z-index: 1000;
			align-items: center;
			justify-content: center;
		}

		.movie-player-overlay.active {
			display: flex;
		}

		.movie-player-container {
			position: relative;
			width: 100%;
			height: 100%;
			background: #000;
			border: 3px solid #6f33ea;
			border-radius: 20px;
			overflow: hidden;
			margin: 20px;
		}

		.movie-player-iframe {
			width: 100%;
			height: 100%;
			border: none;
		}

		.close-player-btn {
			position: absolute;
			top: 20px;
			right: 20px;
			width: 50px;
			height: 50px;
			background: rgba(111, 51, 234, 0.1);
			backdrop-filter: blur(10px);
			border: 2px solid #6f33ea;
			border-radius: 50%;
			color: #6f33ea;
			font-size: 1.5rem;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.3s ease;
			z-index: 1001;
		}

		.close-player-btn:hover {
			background: rgba(111, 51, 234, 0.2);
			border-color: #8855f7;
			transform: scale(1.1);
			color: #8855f7;
		}

		/* Responsive design */
		@media (max-width: 768px) {
			.logo {
				font-size: 2rem;
			}

			.movies-grid {
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				gap: 20px;
			}

			.category-tabs {
				gap: 0.3rem;
			}

			.category-tab {
				font-size: 0.8rem;
				padding: 0.6rem 1.2rem;
			}
		}

		@media (max-width: 480px) {
			.movies-grid {
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: 15px;
			}
		}
	</style>
</head>

<body>
	<div id="particles-js"></div>

	<header>
		<h1 class="logo">Movies Hub</h1>
		<p class="tagline">Discover your next favorite movie</p>
	</header>

	<div class="search-section">
		<div class="search-container">
			<input type="text" class="search-input" placeholder="Search for movies..." id="searchInput">
			<div class="search-icon"></div>
		</div>
	</div>

	<div class="category-section">
		<div class="category-tabs">
			<button class="category-tab active" data-genre="28">Action</button>
			<button class="category-tab" data-genre="53">Thriller</button>
			<button class="category-tab" data-genre="9648">Mystery</button>
			<button class="category-tab" data-genre="27">Horror</button>
			<button class="category-tab" data-genre="878">Sci-Fi</button>
			<button class="category-tab" data-genre="35">Comedy</button>
		</div>
		<div class="category-tabs category-tabs-second">
			<button class="category-tab" data-genre="10751">Family</button>
			<button class="category-tab" data-genre="12">Adventure</button>
			<button class="category-tab" data-genre="18">Drama</button>
			<button class="category-tab" data-genre="14">Fantasy</button>
			<button class="category-tab" data-genre="80">Crime</button>
		</div>
	</div>

	<main>
		<h2 class="section-title" id="sectionTitle">Popular Movies</h2>
		<div class="movies-grid" id="moviesGrid">
			<div class="loading">
				<div class="spinner"></div>
			</div>
		</div>
	</main>

	<div class="movie-player-overlay" id="moviePlayerOverlay">
		<div class="movie-player-container">
			<button class="close-player-btn" id="closePlayerBtn">×</button>
			<iframe class="movie-player-iframe" id="moviePlayerIframe" src="" allowfullscreen></iframe>
		</div>
	</div>

	<script>
		// Initialize particles.js
		particlesJS('particles-js', {
			particles: {
				number: {
					value: 80,
					density: {
						enable: true,
						value_area: 800
					}
				},
				color: {
					value: '#6f33ea'
				},
				shape: {
					type: 'circle'
				},
				opacity: {
					value: 0.5,
					random: false,
					anim: {
						enable: false
					}
				},
				size: {
					value: 3,
					random: true,
					anim: {
						enable: false
					}
				},
				line_linked: {
					enable: true,
					distance: 150,
					color: '#6f33ea',
					opacity: 0.4,
					width: 1
				},
				move: {
					enable: true,
					speed: 2,
					direction: 'bottom',
					random: true,
					straight: false,
					out_mode: 'out',
					bounce: false,
					attract: {
						enable: false,
						rotateX: 600,
						rotateY: 1200
					}
				}
			},
			interactivity: {
				detect_on: 'canvas',
				events: {
					onhover: {
						enable: false,
						mode: 'repulse'
					},
					onclick: {
						enable: false,
						mode: 'push'
					},
					resize: true
				}
			},
			retina_detect: true
		});

		const API_KEY = "79c1de8a90112f2951a563bb7ce87969";
		const BASE_URL = "https://api.themoviedb.org/3";
		const IMG_BASE_URL = "https://image.tmdb.org/t/p/w500";

		const searchInput = document.getElementById("searchInput");
		const moviesGrid = document.getElementById("moviesGrid");
		const sectionTitle = document.getElementById("sectionTitle");
		const moviePlayerOverlay = document.getElementById("moviePlayerOverlay");
		const moviePlayerIframe = document.getElementById("moviePlayerIframe");
		const closePlayerBtn = document.getElementById("closePlayerBtn");

		let searchTimeout;
		let currentGenre = "28"; // Default to Action

		const genreTitles = {
			"28": "Action Movies",
			"53": "Thriller Movies",
			"9648": "Mystery Movies",
			"27": "Horror Movies",
			"878": "Sci-Fi Movies",
			"35": "Comedy Movies",
			"10751": "Family Movies",
			"12": "Adventure Movies",
			"18": "Drama Movies",
			"14": "Fantasy Movies",
			"80": "Crime Movies"
		};

		// Movie Genre mapping for display
		const genreMap = {
			28: "Action",
			12: "Adventure",
			16: "Animation",
			35: "Comedy",
			80: "Crime",
			99: "Documentary",
			18: "Drama",
			10751: "Family",
			14: "Fantasy",
			36: "History",
			27: "Horror",
			10402: "Music",
			9648: "Mystery",
			10749: "Romance",
			878: "Sci-Fi",
			10770: "TV Movie",
			53: "Thriller",
			10752: "War",
			37: "Western"
		};

		async function fetchMoviesByGenre(genreId) {
			try {
				moviesGrid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
				const response = await fetch(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=${genreId}&sort_by=popularity.desc`);
				const data = await response.json();

				displayMovies(data.results);
				sectionTitle.textContent = genreTitles[genreId];
				currentGenre = genreId;
			} catch (error) {
				console.error(`Error fetching genre ${genreId} movies:`, error);
				showError();
			}
		}

		async function fetchPopularMovies() {
			await fetchMoviesByGenre("28"); // Default to Action
		}

		async function searchMovies(query) {
			if (!query.trim()) {
				fetchMoviesByGenre(currentGenre);
				return;
			}

			try {
				moviesGrid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
				const response = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
				const data = await response.json();

				if (data.results.length === 0) {
					showNoResults(query);
				} else {
					displayMovies(data.results);
					sectionTitle.textContent = `Search Results for "${query}"`;
				}
			} catch (error) {
				console.error("Error searching movies:", error);
				showError();
			}
		}

		function displayMovies(movies) {
			moviesGrid.innerHTML = "";

			movies.forEach(movie => {
				if (!movie.poster_path) return; // Skip movies without posters

				const movieCard = document.createElement("div");
				movieCard.className = "movie-card";
				movieCard.onclick = () => {
					openMoviePlayer(movie.id);
				};

				const releaseYear = movie.release_date ? new Date(movie.release_date).getFullYear() : 'N/A';
				const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

				// Get genres for this movie as individual badges
				const movieGenres = movie.genre_ids ?
					movie.genre_ids.map(id => genreMap[id]).filter(Boolean).map(genre =>
						`<span class="genre-badge">${genre}</span>`
					).join('') : '';

				movieCard.innerHTML = `
					<img src="${IMG_BASE_URL}${movie.poster_path}" alt="${movie.title}" class="movie-poster">
					<div class="movie-rating">⭐ ${rating}</div>
					<div class="movie-overlay">
						<div class="movie-title">${movie.title}</div>
						<div class="movie-info">
							<div class="movie-year">${releaseYear}</div>
							${movieGenres ? `<div class="movie-genres">${movieGenres}</div>` : ''}
						</div>
					</div>
				`;

				moviesGrid.appendChild(movieCard);
			});
		}

		function openMoviePlayer(movieId) {
			moviePlayerIframe.src = `https://vidfast.pro/movie/${movieId}?autoPlay=true`;
			moviePlayerOverlay.classList.add('active');
			document.body.style.overflow = 'hidden'; // Prevent background scrolling
		}

		function closeMoviePlayer() {
			moviePlayerOverlay.classList.remove('active');
			moviePlayerIframe.src = ''; // Stop the video
			document.body.style.overflow = 'auto'; // Re-enable scrolling
		}

		function showNoResults(query) {
			moviesGrid.innerHTML = `
				<div class="no-results">
					<h3>No movies found</h3>
					<p>We couldn't find any movies matching "${query}". Try a different search term.</p>
				</div>
			`;
			sectionTitle.textContent = "Search Results";
		}

		function showError() {
			moviesGrid.innerHTML = `
				<div class="no-results">
					<h3>Something went wrong</h3>
					<p>We're having trouble loading movies right now. Please try again later.</p>
				</div>
			`;
		}

		// Category tab functionality
		document.addEventListener('DOMContentLoaded', function() {
			const categoryTabs = document.querySelectorAll(".category-tab");

			categoryTabs.forEach(tab => {
				tab.addEventListener("click", () => {
					// Clear search input when switching categories
					searchInput.value = "";

					// Update active tab
					categoryTabs.forEach(t => t.classList.remove("active"));
					tab.classList.add("active");

					// Fetch movies for selected genre
					const genreId = tab.dataset.genre;
					fetchMoviesByGenre(genreId);
				});
			});
		});

		// Search functionality with debouncing
		searchInput.addEventListener("input", (e) => {
			clearTimeout(searchTimeout);
			const query = e.target.value.trim();

			searchTimeout = setTimeout(() => {
				searchMovies(query);
			}, 500);
		});

		// Enter key search
		searchInput.addEventListener("keypress", (e) => {
			if (e.key === "Enter") {
				clearTimeout(searchTimeout);
				searchMovies(e.target.value.trim());
			}
		});

		// Close player event listeners
		closePlayerBtn.addEventListener('click', closeMoviePlayer);

		// Close player when clicking outside the iframe
		moviePlayerOverlay.addEventListener('click', (e) => {
			if (e.target === moviePlayerOverlay) {
				closeMoviePlayer();
			}
		});

		// Close player with Escape key
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && moviePlayerOverlay.classList.contains('active')) {
				closeMoviePlayer();
			}
		});

		// Initialize with popular movies
		fetchPopularMovies();
	</script>
</body>

</html>
